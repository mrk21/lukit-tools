name: ci

# main への push と Pull Request でユニットテスト（test/Lukit.Tests, xUnit v3）を実行する。
# TFM が Windows 専用（net10.0-windows・x64）なので runner は windows-latest。
# 検証コマンドはローカルと同じ `dotnet test`（リポジトリ直下の Lukit.slnx を自動で拾う）。

on:
  push:
    branches:
      - main
  pull_request:

# 同じブランチ/PR で新しい push があれば古い実行をキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore
